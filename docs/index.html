<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homelab Cards for Home Assistant</title>
<meta name="description" content="Cartes Lovelace pour homelab : UniFi, Proxmox, Synology, Transmission, DNS Technitium, Android TV. Installation HACS en un clic.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#">Homelab Cards</a>
  <nav><a href="#install" data-i18n="nav_install"></a><a href="#cards" data-i18n="nav_cards"></a><a href="#requirements" data-i18n="nav_req"></a></nav>
  <div class="toggle" role="group" aria-label="Language"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
</div></header>
<main class="wrap">
  <div class="hero">
    <h1 data-i18n="h1"></h1>
    <p data-i18n="lead"></p>
    <div class="cta">
      <a class="btn primary" href="https://github.com/Kenny3231/ha-homelab-cards" data-i18n="cta_gh"></a>
      <a class="btn ghost" href="#install" data-i18n="cta_install"></a>
    </div>
  </div>
  <section id="install">
    <h2 data-i18n="h_install"></h2>
    <ol class="steps" id="steps"></ol>
    <p class="req" data-i18n="no_yaml"></p>
  </section>
  <section id="cards"><h2 data-i18n="h_cards"></h2><div id="catalog"></div></section>
  <section id="requirements">
    <h2 data-i18n="h_req"></h2>
    <p data-i18n="req_lead"></p>
    <div class="tablewrap"><table><thead><tr><th data-i18n="th_integ"></th><th data-i18n="th_kind"></th><th data-i18n="th_cards"></th></tr></thead><tbody id="reqs"></tbody></table></div>
  </section>
  <section>
    <h2 data-i18n="h_soon"></h2>
    <p data-i18n="soon"></p>
  </section>
</main>
<footer><div class="wrap"><span data-i18n="foot"></span> · MIT · <a href="https://github.com/Kenny3231/ha-homelab-cards">GitHub</a></div></footer>
<script src="app.js"></script>
</body>
</html>
