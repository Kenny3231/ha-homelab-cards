<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Homelab Cards for Home Assistant</title>
<meta name="description" content="Cartes Lovelace pour homelab : UniFi, Proxmox, Synology, Transmission, DNS Technitium, Android TV. Une seule intégration HACS, vous choisissez les cartes : éditeur visuel intégré, aucune ressource à déclarer.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0288d1">

</head>
<body>

  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>

<a class="skip" href="#main" data-i18n="skip"></a>
<header class="top"><div class="wrap bar">
  <a class="brand" href="#top"><span class="logo"><svg class="ic"><use href="#i-logo"/></svg></span>Homelab Cards</a>
  <nav aria-label="Sections"><a href="#install" data-i18n="nav_install"></a><a href="#cards" data-i18n="nav_cards"></a><a href="#editor" data-i18n="nav_editor"></a><a href="#requirements" data-i18n="nav_req"></a></nav>
  <div class="toggle" role="group" aria-label="Language / Langue"><button type="button" data-lang="fr" lang="fr">FR</button><button type="button" data-lang="en" lang="en">EN</button></div>
  <a class="icon-btn" href="https://github.com/Kenny3231/ha-homelab-cards" aria-label="GitHub"><svg class="ic"><use href="#i-github"/></svg></a>
</div></header>

<main id="main">
  <section class="hero" id="top"><div class="wrap hero-grid">
    <div class="hero-copy">
      <a class="hacs-badge" href="https://hacs.xyz/" aria-label="HACS Custom repository"><span>HACS</span><span>Custom</span></a>
      <h1 data-i18n="h1"></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="cta">
        <a class="btn primary" href="#install"><svg class="ic"><use href="#i-download"/></svg><span data-i18n="cta_install"></span></a>
        <a class="btn ghost" href="https://github.com/Kenny3231/ha-homelab-cards"><svg class="ic"><use href="#i-github"/></svg><span data-i18n="cta_gh"></span></a>
      </div>
      <ul class="facts" id="facts"></ul>
    </div>
    <div class="mosaic" aria-hidden="true">
      <div class="col"><img src="img/unifi-gateway.png" alt=""><img src="img/remote.png" alt=""></div>
      <div class="col"><img src="img/proxmox-node.png" alt=""><img src="img/dns.png" alt=""><img src="img/synology-volumes.png" alt=""></div>
    </div>
  </div></section>

  <section id="install" class="band"><div class="wrap">
    <div class="head"><h2 data-i18n="h_install"></h2><p data-i18n="install_lead"></p></div>
    <div class="install-grid">
      <ol class="steps" id="steps"></ol>
      <aside class="aside-card">
        <h3 data-i18n="quick_h"></h3>
        <p data-i18n="quick_p"></p>
        <a class="btn primary block" href="https://my.home-assistant.io/redirect/hacs_repository/?owner=Kenny3231&amp;repository=ha-homelab-cards&amp;category=integration"><svg class="ic"><use href="#i-ext"/></svg><span data-i18n="quick_btn"></span></a>
        <p class="small" data-i18n="no_yaml"></p>
      </aside>
    </div>
    <div class="pick" id="pick">
      <div class="pick-copy"><h3 data-i18n="pick_h"></h3><p data-i18n="pick_p"></p><ul class="perks" id="pick-perks"></ul></div>
      <figure class="window"><div class="chrome"><i></i><i></i><i></i><span>Homelab Cards</span></div>
        <button type="button" id="pick-shot" data-zoom="img/config-flow.png"><img src="img/config-flow.png" id="pick-img" width="476" height="627" loading="lazy" alt=""></button></figure>
    </div>
  </div></section>

  <section id="cards"><div class="wrap">
    <div class="head"><h2 data-i18n="h_cards"></h2><p data-i18n="cards_lead"></p></div>
    <div class="filters" role="group" id="filters"></div>
    <p class="sr-only" aria-live="polite" id="filter-status"></p>
    <div class="grid" id="catalog"></div>
  </div></section>

  <section id="editor" class="band"><div class="wrap">
    <div class="head"><h2 data-i18n="h_editor"></h2><p data-i18n="editor_lead"></p></div>
    <ul class="perks" id="perks"></ul>
    <div class="tabs" role="tablist" id="editor-tabs"></div>
    <div id="editor-panels"></div>
  </div></section>

  <section id="requirements"><div class="wrap">
    <div class="head"><h2 data-i18n="h_req"></h2><p data-i18n="req_lead"></p></div>
    <div class="req-grid" id="reqs"></div>
  </div></section>

  <section id="soon" class="band"><div class="wrap">
    <div class="head"><h2 data-i18n="h_soon"></h2><p data-i18n="soon"></p></div>
    <div class="soon-grid">
      <a class="soon-item idea" href="https://github.com/Kenny3231/ha-homelab-cards/issues"><span class="soon-ic"><svg class="ic"><use href="#i-plus"/></svg></span><div><h3 data-i18n="idea_h"></h3><p data-i18n="idea_p"></p></div></a>
    </div>
  </div></section>
</main>

<footer><div class="wrap foot">
  <a class="brand" href="#top"><span class="logo"><svg class="ic"><use href="#i-logo"/></svg></span>Homelab Cards</a>
  <p><span data-i18n="foot"></span> · <span data-i18n="foot_aff"></span></p>
  <p>MIT · <a href="https://github.com/Kenny3231/ha-homelab-cards">GitHub</a></p>
</div></footer>

  <button type="button" class="icon-btn lb-close" id="lb-close"><svg class="ic"><use href="#i-close"/></svg></button>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
</dialog>
